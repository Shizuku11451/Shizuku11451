  <path d="M544 300 C554 330 574 345 582 372 M584 410 C576 430 584 450 588 470" stroke="#e98fa6" stroke-width="3"/>

  <!-- head + body -->
  <path d="M332 76 C440 74 520 150 516 270 C514 342 486 382 486 444 C486 522 474 582 400 602 L252 602 C196 590 182 530 184 452 C184 392 148 342 148 270 C148 150 228 78 332 76 Z" fill="#fff6f7"/>

  <!-- face -->
  <path d="M214 284 Q240 252 266 284 M394 284 Q420 252 446 284" stroke-width="5"/>
  <ellipse cx="216" cy="318" rx="26" ry="13" fill="#f79ab0" stroke="none" opacity="0.75" filter="url(#soft)"/>
  <ellipse cx="446" cy="318" rx="26" ry="13" fill="#f79ab0" stroke="none" opacity="0.75" filter="url(#soft)"/>
  <path d="M288 302 Q330 314 378 298 Q374 362 332 368 Q290 364 288 302 Z" fill="#e5627b"/>
  <ellipse cx="334" cy="372" rx="38" ry="26" fill="#f8a5b4" stroke="none" clip-path="url(#mouthClip)"/>
  <path d="M288 302 Q330 314 378 298 Q374 362 332 368 Q290 364 288 302 Z"/>

  <!-- hair cap with zigzag bangs -->
  <path d="M150 278 C148 152 230 80 332 78 C440 76 518 152 514 270 L482 196 L462 238 L432 168 L406 228 L376 160 L348 222 L322 158 L292 226 L266 166 L242 234 L216 172 L192 254 Z" fill="#f6b3c3"/>
  <path d="M152 240 C166 280 170 320 180 356 C190 318 194 284 194 250 Z M512 240 C498 280 494 320 484 356 C474 318 470 284 470 250 Z" fill="#f6b3c3"/>
  <path d="M220 120 C240 140 250 160 256 175 M440 120 C425 140 418 155 414 170" stroke="#e98fa6" stroke-width="3"/>

  <!-- ahoge -->
  <path d="M318 82 C296 44 306 12 344 20 C324 30 322 56 340 80" fill="#f6b3c3"/>

  <!-- sunglasses on head -->
  <path d="M220 118 L252 112 M414 104 L448 112" stroke-width="3"/>
  <rect x="250" y="88" width="76" height="46" rx="18" fill="#caa066" transform="rotate(-4 288 111)"/>
  <rect x="340" y="82" width="76" height="46" rx="18" fill="#caa066" transform="rotate(-4 378 105)"/>
  <path d="M326 106 Q333 98 340 104" stroke-width="3"/>
  <path class="heart" d="M288 119 C274.5 108.5, 279 96.5, 288 104 C297 96.5, 301.5 108.5, 288 119 Z" fill="#7fdde6" stroke="#2b2024" stroke-width="2"/>
  <path class="heart" d="M378 113 C364.5 102.5, 369 90.5, 378 98 C387 90.5, 391.5 102.5, 378 113 Z" fill="#7fdde6" stroke="#2b2024" stroke-width="2"/>

  <!-- snack -->
  <g class="snack">
    <path d="M298 352 C318 306 434 336 438 428 C410 410 350 398 298 352 Z" fill="#f6994f"/>
    <path d="M334 340 C370 336 404 360 418 396" stroke="#ffc58f" stroke-width="5"/>
    <path d="M360 374 L372 352 M392 394 L404 372" stroke="#fde7a6" stroke-width="3"/>
  </g>
  <ellipse cx="304" cy="372" rx="16" ry="13" fill="#fff6f7" stroke-width="3.5"/>
  <ellipse cx="428" cy="430" rx="16" ry="13" fill="#fff6f7" stroke-width="3.5"/>

  <!-- oranges -->
  
  <g class="orange" style="animation-delay:0s">
