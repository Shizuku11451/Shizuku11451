    <ellipse cx="261.7" cy="531.7" rx="16.240000000000002" ry="9.28" fill="#ffc58f" transform="rotate(-25 261.7 531.7)"/>
    <path d="M276 516.04 L290 511.4" stroke-width="3"/>
  </g>
  
  <g class="orange" style="animation-delay:0.5s">
    <path d="M472 538 C472 485.5, 572 485.5, 572 538 C572 585.5, 472 585.5, 472 538 Z" fill="#f6994f"/>
    <ellipse cx="504.5" cy="520.5" rx="14.000000000000002" ry="8" fill="#ffc58f" transform="rotate(-25 504.5 520.5)"/>
